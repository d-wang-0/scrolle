<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrolle options</title>
    <link rel="icon" type="image/png" href="icons/32x32.png" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: flex; gap: 0.6rem; align-items: flex-start; }
      small { display: block; opacity: 0.7; margin-top: 0.2rem; }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="openWebEpubs" />
      <span>
        Open EPUBs from the web in the reader
        <small>Links and downloads of .epub files open in the reader instead of downloading. Local files opened or dragged into Chrome always open in the reader.</small>
      </span>
    </label>
    <script src="options.js"></script>
  </body>
</html>
