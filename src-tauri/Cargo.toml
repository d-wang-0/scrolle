[package]
name = "scrolle"
version = "0.1.0"
description = "A continuous-scroll EPUB reader"
license = "AGPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
# Thin LTO and several codegen units let the compile use every core; fat LTO with one unit is
# single-threaded and slower to build for a slightly smaller exe.
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
